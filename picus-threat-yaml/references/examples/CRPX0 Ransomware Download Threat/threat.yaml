                      Operator: eq
                Operator: or
          actions:
            - name: CRPX0 Ransomware .EXE File Download Variant-1
              title: Download
              description: CRPX0 is a newly emerged cybercriminal group that transitioned from running cryptocurrency scams to operating a full Ransomware-as-a-Service and Hacking-as-a-Service platform, having already listed 47 victims primarily across the United States and Turkey, with the Healthcare sector bearing the heaviest impact. The group lures victims through deceptive social engineering techniques — including fake browser prompts — that trick users into executing malicious code, which then deploys multiple stages of malware capable of disabling security tools, evading endpoint defenses, and establishing persistent access on compromised systems. CRPX0 operates both a dark web data leak site and publicly accessible domains to pressure victims, with infrastructure concealed behind content delivery services and registered through a non-compliant Russian domain registrar. The deliberate exclusion of Commonwealth of Independent States countries from targeting is a recognized behavioral indicator associated with Russian-linked ransomware operations, suggesting the group operates with a degree of regional protection.
              affected_os:
                - Windows
              malware_family: CRPX0
              is_atomic: true
              ukc_phase: Delivery
              category: Malicious Code
              is_applicable_to_all_platforms: true
