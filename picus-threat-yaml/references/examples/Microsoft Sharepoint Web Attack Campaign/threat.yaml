          actions:
            - name: SharePoint Remote Code Execution via WebParts
              title: Exploitation
              description: This attack includes a payload that exploits a critical remote code execution vulnerability in Microsoft SharePoint using WebParts. SharePoint does not restrict available Types for properties when it parses the XML configuration of WebParts. For a property, an attacker may specify a string and a type name, and SharePoint will attempt to convert the string using a TypeConverter corresponding to the specified type. Furthermore, this vulnerability is marked as CVE-2020-0932.
              comment: wats-auto-migrated
