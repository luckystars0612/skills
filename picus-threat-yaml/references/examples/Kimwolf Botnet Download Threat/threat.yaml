                Operator: or
          actions:
            - name: Kimwolf Botnet .ELF File Download Variant-1
              title: Download
              description: Kimwolf (also tracked as AISURU) is an Android and IoT botnet active since August 2024, primarily targeting Android TV boxes and set-top boxes that are commonly found in both consumer and enterprise environments. The botnet spreads by exploiting an exposed remote debugging interface that ships enabled by default on many Android TV devices, allowing attackers to silently install malware without user interaction. Once compromised, devices are enrolled into a large-scale botnet capable of launching sophisticated denial-of-service attacks that mimic legitimate web browser traffic, making them significantly harder for defenders to filter. Version 7 of Kimwolf introduces a resilient three-tier command infrastructure leveraging blockchain-based domain resolution, encrypted anonymization networks, and local proxy routing — a direct architectural response to prior law enforcement takedown efforts — ensuring the botnet remains operational even if individual control servers are disrupted.
              affected_os:
                - Linux
              malware_family: Kimwolf
              is_atomic: true
              ukc_phase: Delivery
              category: Malicious Code
              is_applicable_to_all_platforms: true
